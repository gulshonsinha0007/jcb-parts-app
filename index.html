<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podder & Podder (E & P) Pvt. Ltd. - JCB Parts Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  :root {
    --bg-main: #0c0e12;
    --bg-card: #14171f;
    --bg-card-hover: #1c202b;
    --bg-input: #1a1e29;
    --border-color: #2a2f3d;
    --border-focus: #f59e0b;
    
    --jcb-amber: #f59e0b;
    --jcb-amber-dark: #d97706;
    --jcb-amber-glow: rgba(245, 158, 11, 0.15);
    
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --text-dark: #111827;
    
    --error-bg: rgba(239, 68, 68, 0.1);
    --error-color: #f87171;
    
    --display-font: "Oswald", sans-serif;
    --body-font: "Inter", system-ui, -apple-system, sans-serif;
    --mono-font: "JetBrains Mono", monospace;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: var(--body-font);
    font-size: 14px;
    line-height: 1.5;
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.05) 0%, transparent 70%),
      linear-gradient(to bottom, rgba(0,0,0,0.6), var(--bg-main)),
      url('./jcb-background.jpeg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* Hazard Stripe Accent Line */
  .stripe {
    height: 4px;
    width: 100%;
    background: repeating-linear-gradient(
      -45deg,
      #f59e0b,
      #f59e0b 10px,
      #111827 10px,
      #111827 20px
    );
  }

  /* Core Buttons */
  button {
    font-family: var(--body-font);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--jcb-amber);
    color: var(--text-dark);
    border: 1px solid var(--jcb-amber);
    border-radius: 8px;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  button:hover:not(:disabled) {
    background: var(--jcb-amber-dark);
    border-color: var(--jcb-amber-dark);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  
  button.ghost {
    background: transparent;
    color: var(--text-main);
    border-color: var(--border-color);
    box-shadow: none;
  }
  button.ghost:hover:not(:disabled) {
    background: var(--bg-card-hover);
    border-color: var(--text-muted);
    color: #fff;
    box-shadow: none;
  }

  button.small { padding: 4px 10px; font-size: 0.775rem; border-radius: 6px; }
  button.danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.3);
    color: #f87171;
  }
  button.danger:hover:not(:disabled) {
    background: rgba(239, 68, 68, 0.9);
    border-color: rgba(239, 68, 68, 0.9);
    color: #fff;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
  }

  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--jcb-amber);
    outline-offset: 1px;
  }

  /* Form Elements */
  label {
    display: block;
    font-weight: 500;
    font-size: 0.825rem;
    color: var(--text-muted);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  label small {
    display: block;
    font-weight: 400;
    color: var(--text-muted);
    text-transform: none;
    margin-top: 4px;
    letter-spacing: normal;
  }
  input[type=email], input[type=password], input[type=text], input[type=search], select {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 14px;
    font-family: var(--body-font);
    font-size: 0.9rem;
    color: var(--text-main);
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    transition: all 0.2s ease;
  }
  input[type=email]:focus, input[type=password]:focus, input[type=text]:focus, input[type=search]:focus, select:focus {
    border-color: var(--jcb-amber);
    box-shadow: 0 0 0 3px var(--jcb-amber-glow);
    background: #1e2330;
  }

  /* Feedback Messages */
  .msg { min-height: 1.4em; margin: 12px 0 0; font-size: 0.85rem; color: var(--text-muted); font-family: var(--mono-font); }
  .msg.error {
    color: var(--error-color);
    background: var(--error-bg);
    padding: 8px 12px;
    border-radius: 6px;
    border-left: 3px solid var(--error-color);
  }

  /* ---------- Login Section (Right Side) ---------- */
  #login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 24px 60px;
    position: relative;
    z-index: 10;
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: rgba(26, 30, 41, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  }
  .login-body { padding: 32px 28px; }
  .login-brand-tag {
    font-family: var(--mono-font);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--jcb-amber);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .login-body h1 {
    font-family: var(--display-font);
    font-size: 2rem;
    color: var(--jcb-amber);
    margin: 0 0 6px 0;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .login-body p { margin: 0 0 24px; color: var(--text-muted); font-size: 0.875rem; }
  .pw-row { position: relative; display: block; }
  .pw-row input { padding-right: 80px; }
  .pw-toggle {
    position: absolute; right: 6px; bottom: 5px;
    padding: 4px 10px; font-size: 0.75rem;
    border-radius: 6px; background: var(--bg-card);
  }
  #login-btn { width: 100%; margin-top: 10px; padding: 12px; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

  /* ---------- Application View ---------- */
  header.top {
    background: rgba(20, 23, 31, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .top-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .top-brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .top-logo-icon {
    width: 36px;
    height: 36px;
    background: var(--jcb-amber);
    color: var(--text-dark);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
  }
  .top h1 {
    font-family: var(--display-font);
    font-size: 1.5rem;
    color: #fff;
    letter-spacing: 0.03em;
  }
  .top-subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--mono-font);
    display: block;
    margin-top: -2px;
  }
  .who { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--text-muted); }
  .badge {
    font-family: var(--mono-font);
    font-weight: 600;
    font-size: 0.725rem;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    background: var(--bg-input);
    color: var(--jcb-amber);
    text-transform: uppercase;
  }
  .badge.admin {
    background: var(--jcb-amber-glow);
    border-color: var(--jcb-amber);
    color: var(--jcb-amber);
  }

  main { max-width: 1400px; margin: 0 auto; padding: 24px 24px 80px; }
  
  .controls {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    background: rgba(20, 23, 31, 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-color);
    padding: 12px;
    border-radius: 12px;
  }
  
  .tabs { display: flex; gap: 4px; background: var(--bg-main); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
  .tabs button {
    background: transparent;
    color: var(--text-muted);
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.825rem;
    font-weight: 600;
    box-shadow: none;
  }
  .tabs button:hover { background: var(--bg-card-hover); color: #fff; transform: none; }
  .tabs button[aria-selected=true] {
    background: var(--jcb-amber);
    color: var(--text-dark);
  }

  .search { flex: 1; max-width: 500px; position: relative; }
  .search label { margin: 0; text-transform: none; }
  .search input {
    margin: 0;
    padding-left: 38px;
    background: var(--bg-main);
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .panel {
    background: rgba(20, 23, 31, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  
  .count {
    margin: 0 0 12px;
    font-size: 0.8rem;
    font-family: var(--mono-font);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .table-wrap {
    overflow: auto;
    max-height: 65vh;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--bg-main);
  }
  
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.85rem; }
  th {
    position: sticky; top: 0; z-index: 10;
    background: #181c27;
    color: var(--text-muted);
    text-transform: uppercase;
    font-size: 0.725rem;
    font-family: var(--mono-font);
    letter-spacing: 0.05em;
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-color);
    vertical-align: middle;
    color: var(--text-main);
    max-width: 380px;
    overflow-wrap: anywhere;
  }
  td.nowrap {
    white-space: nowrap;
    font-family: var(--mono-font);
    font-weight: 600;
    color: var(--jcb-amber);
  }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button + button { margin-left: 6px; }
  tbody tr { transition: background 0.15s ease; }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.015); }
  tbody tr:hover { background: rgba(245, 158, 11, 0.06); }
  td a {
    color: #60a5fa;
    text-decoration: none;
    font-weight: 500;
    margin-right: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  td a:hover { text-decoration: underline; }
  .empty { padding: 36px 12px; text-align: center; color: var(--text-muted); font-family: var(--mono-font); }

  /* ---------- Modal Dialog ---------- */
  dialog {
    width: min(580px, 92vw);
    max-height: 90vh;
    overflow: auto;
    padding: 0;
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); }
  .dlg-body { padding: 28px; }
  .dlg-body h2 {
    font-family: var(--display-font);
    font-size: 1.6rem;
    margin-bottom: 20px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  #dlg-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
  #dlg-fields label.wide { grid-column: 1 / -1; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color); }
  input[readonly] { opacity: 0.7; background: rgba(255,255,255,0.03); cursor: not-allowed; }
  
  /* Autocomplete Suggestions dropdown */
  .ac-wrap { display: block; position: relative; }
  .ac-list {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 50;
    margin: 4px 0 0; padding: 4px; list-style: none; max-height: 220px; overflow: auto;
    background: #181c27; border: 1px solid var(--jcb-amber); border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .ac-list li {
    padding: 8px 12px;
    cursor: pointer;
    font-weight: 400;
    border-radius: 6px;
    transition: background 0.15s ease;
  }
  .ac-list li strong { display: block; color: var(--jcb-amber); font-family: var(--mono-font); font-size: 0.85rem; }
  .ac-list li small { margin: 0; color: var(--text-muted); font-size: 0.775rem; }
  .ac-list li:hover, .ac-list li.active { background: var(--jcb-amber-glow); color: #fff; }

  /* ---------- Media Widget (Left Side: Video & Image) ---------- */
  .ad-box {
    position: fixed;
    left: 20px;
    right: auto;
    bottom: 20px;
    width: 300px;
    z-index: 100;
    background: rgba(20, 23, 31, 0.95);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    transition: all 0.3s ease;
  }
  .ad-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .ad-header small {
    color: var(--jcb-amber);
    font-family: var(--mono-font);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ad-close-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 2px 6px;
    font-size: 0.75rem;
    border-radius: 4px;
  }
  .ad-close-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .ad-box video {
    display: block;
    width: 100%;
    height: 155px;
    object-fit: cover;
    background: #000;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .ad-box img {
    display: block;
    width: 100%;
    height: 315px;
    object-fit: cover;
    background: #000;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    margin-top: 8px;
  }

  @media (max-width: 768px) {
    #login { padding: 24px 16px; justify-content: center; }
    .top-inner { flex-direction: column; align-items: flex-start; }
    .controls { flex-direction: column; align-items: stretch; }
    .search { max-width: 100%; }
    .ad-box { width: 220px; left: 10px; bottom: 10px; }
    .ad-box video, .ad-box img { height: 110px; }
  }
</style>
</head>
<body>

<!-- MEDIA WIDGET (VIDEO + IMAGE ON LEFT) -->
<div class="ad-box" id="adBox">
  <div class="ad-header">
    <small><i data-lucide="play-circle" style="width: 12px; height: 12px;"></i> Official JCB Media</small>
    <button class="ad-close-btn" onclick="document.getElementById('adBox').style.display='none'" title="Hide promo">✕</button>
  </div>
  <video src="jcb-video.mp4" autoplay muted loop playsinline controls></video>
  <img src="jcb-image.jpeg" alt="JCB Banner Image">
</div>

<!-- ======== LOGIN VIEW (RIGHT SIDE) ======== -->
<div id="login">
  <div class="login-card">
    <div class="stripe"></div>
    <div class="login-body">
      <div class="login-brand-tag">
        <i data-lucide="shield-check" style="width:14px; height:14px;"></i> Enterprise Access
      </div>
      <h1 style="font-size:24px; line-height:1.2;">
Price & Parts-info  Podder(Dist) Pricelist Nov 2026
</h1>
      <p>Website Developed & Designed by Gulshon Sinha</p>
            
      <form id="login-form" novalidate>
        <label>Retailers Email
          <input id="email" type="email" autocomplete="username" required placeholder="you@gmail.com">
        </label>
        
        <label>Password
          <span class="pw-row">
            <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button id="pw-toggle" class="ghost pw-toggle" type="button" aria-pressed="false">Show</button>
          </span>
        </label>
        
        <button id="login-btn" type="submit">
          Sign In To Portal
        </button>
        
        <p id="login-msg" class="msg" role="alert"></p>
      </form>
    </div>
  </div>
</div>

<!-- ======== MAIN APPLICATION VIEW ======== -->
<div id="app" hidden>
  <header class="top">
    <div class="stripe"></div>
    <div class="top-inner">
      <div class="top-brand-group">
        <div class="top-logo-icon">
          <i data-lucide="wrench" style="width: 20px; height: 20px;"></i>
        </div>
        <div>
          <h1>Gulshon's JCB Parts Portal  / Price List Nov 2026</h1>
          <span class="top-subtitle">Price & Parts Info By Gulshon / Price List Updated</span>
        </div>
      </div>
      
      <div class="who">
        <i data-lucide="user" style="width: 14px; height: 14px;"></i>
        <span id="who"></span>
        <span id="badge" class="badge">User</span>
        <button id="logout" class="ghost small" type="button">
          <i data-lucide="log-out" style="width: 12px; height: 12px;"></i> Sign Out
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="controls">
      <!-- Sheet Selector Tabs -->
      <div class="tabs" role="tablist" aria-label="Sheets">
        <button type="button" role="tab" data-key="pricelist" aria-selected="true">Price List</button>
        <button type="button" role="tab" data-key="partsinfo" aria-selected="false">PartsInfo</button>
        <button type="button" role="tab" data-key="users" id="tab-users" aria-selected="false" hidden>Users</button>
      </div>

      <!-- Live Table Search Field -->
      <div class="search" id="search-wrap">
        <label for="q">
          <div style="position: relative;">
            <i data-lucide="search" class="search-icon" style="width: 16px; height: 16px;"></i>
            <input id="q" type="search" placeholder="Search Part Number, Description, or Model (e.g. 332/ filter 3DX)..." autocomplete="off">
          </div>
        </label>
      </div>

      <!-- Contextual Action Button -->
      <button id="add-btn" type="button" hidden>
        <i data-lucide="plus" style="width: 16px; height: 16px;"></i> Add Part
      </button>
    </div>

    <!-- Main Data Table Container -->
    <div class="panel">
      <p id="count" class="count" role="status"></p>
      <div class="table-wrap">
        <table id="table"></table>
      </div>
      <p id="data-msg" class="msg" role="status"></p>
    </div>
  </main>
</div>

<!-- ======== ADD / EDIT DIALOG MODAL ======== -->
<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="stripe"></div>
  <form id="dlg-form" class="dlg-body" novalidate>
    <h2 id="dlg-title"></h2>
    <div id="dlg-fields"></div>
    <p id="dlg-msg" class="msg" role="alert"></p>
    <div class="dlg-actions">
      <button id="dlg-cancel" class="ghost" type="button">Cancel</button>
      <button id="dlg-save" type="submit">Save Record</button>
    </div>
  </form>
</dialog>

<script>
  // Paste your Apps Script Web App URL here (ends in /exec).
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzimWxeaL6EEeld9hMC_hltiA-ARb2nbFVva3bu6VFgC5iWGovUdKdHr-AVn-OqrCZ2/exec";

  const ROW_LIMIT = 300;
  const NOWRAP_COLS = ["PART NO", "RP", "MRP", "HSN", "GST", "CAT1", "CAT2", "GROUP"];

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  };

  let token = store.get("jcb_token");
  let email = store.get("jcb_email");
  let role = store.get("jcb_role") || "user";
  let canAdd = store.get("jcb_canadd") === "1";   // may add rows to PartsInfo
  let currentKey = "pricelist";
  let loadSeq = 0;
  const cache = {};   // key -> { headers, rows: [{cells, hay, num}] }
  let searchTimer = null;

  /* ---------- Server calls ---------- */
  async function api(body) {
    if (SCRIPT_URL.startsWith("PASTE")) {
      return { ok: false, error: "Set SCRIPT_URL at the top of this file's script first." };
    }
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body)
      });
      const out = await res.json();
      if (out && out.ok && out.role && (out.role !== role || !!out.canAdd !== canAdd)) updateRole(out.role, out.canAdd);
      return out;
    } catch (err) {
      return { ok: false, error: "Can't reach the server. Check your internet and the web app URL." };
    }
  }

  function setMsg(el, text, isError) {
    el.textContent = text || "";
    el.classList.toggle("error", !!isError);
  }

  /* ---------- Role ---------- */
  function updateRole(r, c) {
    role = r === "admin" ? "admin" : "user";
    canAdd = role === "admin" || !!c;
    store.set("jcb_role", role);
    store.set("jcb_canadd", canAdd ? "1" : "0");
    applyRole();
  }

  function applyRole() {
    const admin = role === "admin";
    $("tab-users").hidden = !admin;
    $("badge").textContent = admin ? "Admin" : canAdd ? "User (can add PartsInfo)" : "User";
    $("badge").classList.toggle("admin", admin);
    if (!admin && currentKey === "users") currentKey = "pricelist";
    updateAddButton();
  }

  function updateAddButton() {
    const btn = $("add-btn");
    btn.hidden = !(role === "admin" || (canAdd && currentKey === "partsinfo"));
    btn.textContent = currentKey === "users" ? "Add User"
      : currentKey === "partsinfo" ? "Add Part Info" : "Add Part";
  }

  /* ---------- Login / logout ---------- */
  function showLogin(message) {
    $("app").hidden = true;
    $("login").hidden = false;
    setMsg($("login-msg"), message || "", !!message);
    $("password").value = "";
  }

  function showApp() {
    $("login").hidden = true;
    $("app").hidden = false;
    $("who").textContent = email || "";
    applyRole();
    loadSheet(currentKey);
    lucide.createIcons();
  }

  function logout(message) {
    token = null; email = null; role = "user"; canAdd = false; currentKey = "pricelist";
    ["jcb_token", "jcb_email", "jcb_role", "jcb_canadd"].forEach((k) => store.del(k));
    Object.keys(cache).forEach((k) => delete cache[k]);
    if ($("dlg").open) $("dlg").close();
    showLogin(message);
  }

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("login-btn");
    btn.disabled = true;
    setMsg($("login-msg"), "Authenticating in Retailers...");
    const out = await api({ action: "login", email: $("email").value, password: $("password").value });
    btn.disabled = false;
    if (!out.ok) { setMsg($("login-msg"), out.error, true); return; }
    token = out.token; email = out.email;
    store.set("jcb_token", token); store.set("jcb_email", email);
    updateRole(out.role, out.canAdd);
    setMsg($("login-msg"), "");
    showApp();
  });

  $("pw-toggle").addEventListener("click", () => {
    const pw = $("password");
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    $("pw-toggle").textContent = show ? "Hide" : "Show";
    $("pw-toggle").setAttribute("aria-pressed", String(show));
  });

  $("logout").addEventListener("click", () => logout(""));

  /* ---------- Loading a tab ---------- */
  function storeSheet(key, out) {
    cache[key] = {
      headers: out.headers,
      rows: out.rows.map((cells, i) => ({
        cells: cells,
        hay: cells.join(" ").toLowerCase(),
        num: out.nums[i]
      }))
    };
  }

  async function loadSheet(key) {
    currentKey = key;
    const mySeq = ++loadSeq;
    document.querySelectorAll(".tabs button").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.key === key));
    });
    $("search-wrap").hidden = key === "users";
    updateAddButton();

    if (key === "users") { await loadUsers(mySeq); return; }
    if (cache[key]) { render(); return; }

    $("table").innerHTML = "";
    setMsg($("count"), "");
    setMsg($("data-msg"), "Fetching JCB Catalog Data...");
    const out = await api({ action: "data", token: token, sheet: key });
    if (mySeq !== loadSeq) return;

    if (!out.ok) {
      if (out.error === "auth") { logout("Your session ended. Sign in again."); return; }
      setMsg($("data-msg"), out.error, true);
      return;
    }
    storeSheet(key, out);
    setMsg($("data-msg"), "");
    render();
  }

  /* ---------- Parts table ---------- */
  function isUrl(s) { return /^https?:\/\/\S+$/i.test(s); }

  function fillCell(td, value) {
    const text = String(value ?? "");
    const parts = text.split(/[\s,]+/).filter(Boolean);
    if (parts.length && parts.every(isUrl)) {
      parts.forEach((u, i) => {
        const a = document.createElement("a");
        a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.innerHTML = `<i data-lucide="external-link" style="width:12px; height:12px;"></i> ` + (parts.length > 1 ? "Link " + (i + 1) : "Open Specs");
        td.appendChild(a);
      });
    } else {
      td.textContent = text;
    }
  }

  function addHeader(row, text) {
    const th = document.createElement("th");
    th.textContent = text;
    row.appendChild(th);
  }

  function smallButton(label, cls, handler) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "small " + (cls || "");
    b.textContent = label;
    b.addEventListener("click", handler);
    return b;
  }

  function render() {
    const data = cache[currentKey];
    if (!data) return;
    const admin = role === "admin";
    const words = $("q").value.toLowerCase().split(/\s+/).filter(Boolean);
    const matches = words.length ? data.rows.filter((r) => words.every((w) => r.hay.includes(w))) : data.rows;
    const shown = matches.slice(0, ROW_LIMIT);

    const table = $("table");
    table.innerHTML = "";
    const headRow = table.createTHead().insertRow();
    data.headers.forEach((h) => addHeader(headRow, h));
    if (admin) addHeader(headRow, "Actions");

    const body = table.createTBody();
    shown.forEach((r) => {
      const tr = body.insertRow();
      data.headers.forEach((h, i) => {
        const td = tr.insertCell();
        if (NOWRAP_COLS.indexOf(String(h).trim().toUpperCase()) !== -1) td.className = "nowrap";
        fillCell(td, r.cells[i]);
      });
      if (admin) {
        const td = tr.insertCell();
        td.className = "actions";
        td.appendChild(smallButton("Edit", "ghost", () => openPartForm(r)));
        td.appendChild(smallButton("Delete", "danger", () => deletePart(r)));
      }
    });

    if (!shown.length) {
      const td = body.insertRow().insertCell();
      td.colSpan = data.headers.length + (admin ? 1 : 0);
      td.className = "empty";
      td.textContent = words.length
        ? "No matching JCB parts found. Refine your query."
        : "This catalog view currently contains no entries.";
    }

    let note = "Showing " + shown.length.toLocaleString() + " of " + matches.length.toLocaleString() + " parts";
    if (matches.length > ROW_LIMIT) note += " (Narrow down search to view all results)";
    setMsg($("count"), note);
    lucide.createIcons();
  }

  document.querySelectorAll(".tabs button").forEach((b) => {
    b.addEventListener("click", () => loadSheet(b.dataset.key));
  });

  $("q").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 150);
  });

  /* ---------- Admin: parts ---------- */
  const normH = (s) => String(s).toLowerCase().replace(/\s+/g, "");

  function partIndex() {
    const d = cache.pricelist;
    if (!d) return null;
    if (!d.index) {
      let pi = d.headers.findIndex((h) => normH(h) === "partno");
      if (pi < 0) pi = 0;
      const di = d.headers.findIndex((h) => normH(h) === "description");
      const list = d.rows
        .map((r) => ({ pn: String(r.cells[pi] ?? "").trim(), desc: di >= 0 ? String(r.cells[di] ?? "").trim() : "" }))
        .filter((x) => x.pn);
      list.forEach((x) => { x.low = x.pn.toLowerCase(); x.dlow = x.desc.toLowerCase(); });
      d.index = { list: list, map: new Map(list.map((x) => [x.low, x])) };
    }
    return d.index;
  }

  function findPart(v) {
    const idx = partIndex();
    return idx ? idx.map.get(String(v).trim().toLowerCase()) || null : null;
  }

  function suggestParts(q) {
    const idx = partIndex();
    const s = String(q).trim().toLowerCase();
    if (!idx || !s) return [];
    const starts = [], has = [], inDesc = [];
    for (const x of idx.list) {
      if (x.low.startsWith(s)) starts.push(x);
      else if (x.low.includes(s)) has.push(x);
      else if (x.dlow.includes(s)) inDesc.push(x);
      if (starts.length >= 8) break;
    }
    return starts.concat(has, inDesc).slice(0, 8).map((x) => ({ value: x.pn, detail: x.desc, data: x }));
  }

  async function openPartForm(r) {
    const key = currentKey;
    const editing = !!r;
    const lookup = !editing && key === "partsinfo";

    if (lookup && !cache.pricelist) {
      setMsg($("data-msg"), "Loading part numbers…");
      const out = await api({ action: "data", token: token, sheet: "pricelist" });
      if (out.error === "auth") { logout("Your session ended. Sign in again."); return; }
      if (!out.ok) { setMsg($("data-msg"), out.error, true); return; }
      storeSheet("pricelist", out);
      setMsg($("data-msg"), "");
    }

    const data = cache[key];
    if (!data) return;
    const partH = data.headers.find((h) => normH(h) === "partno") || data.headers[0];
    const descH = data.headers.find((h) => normH(h) === "description");
    const isAdmin = role === "admin";
    const addTitle = key === "partsinfo" ? "Add Part Info Record" : "Add Spare Part";

    openForm({
      title: editing ? "Edit Part Details" : addTitle,
      saveLabel: editing ? "Save Changes" : addTitle,
      fields: data.headers.map((h, i) => {
        const f = { name: h, label: h, value: editing ? String(r.cells[i] ?? "") : "", wide: /desc|link/i.test(h) || (lookup && h === partH) };
        if (lookup && h === partH) { f.suggest = true; f.placeholder = "Type part number (e.g. 320/08608)"; }
        if (lookup && h === descH) {
          f.readonly = true;
          f.placeholder = "Auto-filled from Price List";
          f.hint = "Description is matched automatically from the Price List catalog.";
        }
        return f;
      }),
      getSuggestions: lookup ? suggestParts : null,
      onPick: (item, set) => { if (descH) set(descH, item.data.desc); },
      onType: (value, set) => {
        const hit = findPart(value);
        if (descH) set(descH, hit ? hit.desc : "");
      },
      onSubmit: async (values) => {
        const body = { action: editing ? "row_update" : "row_add", token: token, sheet: key };
        if (editing) {
          const changed = {};
          let any = false;
          data.headers.forEach((h, i) => {
            if (values[h] !== String(r.cells[i] ?? "").trim()) { changed[h] = values[h]; any = true; }
          });
          if (!any) return { ok: true };
          body.row = r.num; body.check = r.cells[0]; body.values = changed;
        } else {
          if (lookup) {
            const hit = findPart(values[partH]);
            if (!hit && !isAdmin) return { ok: false, error: "Please select a valid part number from the Price List suggestions." };
            if (hit) { values[partH] = hit.pn; if (descH) values[descH] = hit.desc; }
          }
          body.values = values;
        }
        const out = await api(body);
        if (out.ok) { delete cache[key]; loadSheet(key); }
        return out;
      }
    });
  }

  async function deletePart(r) {
    if (!confirm("Delete part " + r.cells[0] + "?\nThis action will permanently remove the record from the Google Sheet.")) return;
    setMsg($("data-msg"), "Deleting record...");
    const out = await api({ action: "row_delete", token: token, sheet: currentKey, row: r.num, check: r.cells[0] });
    if (out.error === "auth") { logout("Your session ended. Sign in again."); return; }
    if (!out.ok) { setMsg($("data-msg"), out.error, true); return; }
    delete cache[currentKey];
    loadSheet(currentKey);
  }

  /* ---------- Admin: users ---------- */
  let usersList = [];

  async function loadUsers(mySeq) {
    $("table").innerHTML = "";
    setMsg($("count"), "");
    setMsg($("data-msg"), "Loading authorized user access list...");
    const out = await api({ action: "users_list", token: token });
    if (mySeq !== loadSeq) return;
    if (!out.ok) {
      if (out.error === "auth") { logout("Your session ended. Sign in again."); return; }
      setMsg($("data-msg"), out.error, true);
      return;
    }
    usersList = out.users;
    setMsg($("data-msg"), "");
    renderUsers();
  }

  function renderUsers() {
    const table = $("table");
    table.innerHTML = "";
    const headRow = table.createTHead().insertRow();
    ["Operator Email", "Role", "Can Add PartsInfo", "Actions"].forEach((h) => addHeader(headRow, h));
    const body = table.createTBody();
    usersList.forEach((u) => {
      const tr = body.insertRow();
      const isMe = u.email === email;
      const c1 = tr.insertCell(); c1.className = "nowrap"; c1.textContent = u.email + (isMe ? " (You)" : "");
      tr.insertCell().textContent = u.role === "admin" ? "Administrator" : "Standard User";
      tr.insertCell().textContent = u.role === "admin" ? "Yes (Admin Rights)" : (u.canAdd ? "Yes" : "No");
      const td = tr.insertCell(); td.className = "actions";
      td.appendChild(smallButton("Edit", "ghost", () => openUserForm(u)));
      const del = smallButton("Remove", "danger", () => removeUser(u));
      del.disabled = isMe;
      td.appendChild(del);
    });
    setMsg($("count"), usersList.length + (usersList.length === 1 ? " user registered" : " users registered"));
    lucide.createIcons();
  }

  function openUserForm(u) {
    const editing = !!u;
    openForm({
      title: editing ? "Edit User Privileges" : "Add New Operator",
      saveLabel: editing ? "Save Changes" : "Create User",
      fields: [
        { name: "email", label: "Operator Email", type: "email", value: editing ? u.email : "", disabled: editing, wide: true },
        { name: "password", label: editing ? "New Password" : "Password", type: "password",
          autocomplete: "new-password", wide: true,
          hint: editing ? "Leave blank to keep current password." : "Minimum 6 characters." },
        { name: "role", label: "Access Role", wide: true, value: editing ? u.role : "user",
          options: [
            { value: "user", label: "User (Search and View Only)" },
            { value: "admin", label: "Admin (Full Edit & User Management)" }
          ] },
        { name: "canAdd", label: "Can Add PartsInfo", wide: true, value: editing && u.canAdd ? "yes" : "no",
          hint: "Allows standard users to insert new rows to PartsInfo without edit/delete rights.",
          options: [
            { value: "no", label: "No" },
            { value: "yes", label: "Yes" }
          ] }
      ],
      onSubmit: async (values) => {
        const out = await api({
          action: "user_save", token: token,
          email: editing ? u.email : values.email,
          password: values.password, role: values.role,
          canAdd: values.canAdd === "yes"
        });
        if (out.ok) loadSheet("users");
        return out;
      }
    });
  }

  async function removeUser(u) {
    if (!confirm("Revoke access for " + u.email + "?\nThey will no longer be able to log in to the portal.")) return;
    const out = await api({ action: "user_delete", token: token, email: u.email });
    if (out.error === "auth") { logout("Your session ended. Sign in again."); return; }
    if (!out.ok) { setMsg($("data-msg"), out.error, true); return; }
    loadSheet("users");
  }

  $("add-btn").addEventListener("click", () => {
    if (currentKey === "users") openUserForm(null); else openPartForm(null);
  });

  /* ---------- Generic dialog ---------- */
  let dlgInputs = [];
  let dlgSubmit = null;

  function attachSuggest(input, list, cfg, setField) {
    let items = [];
    let active = -1;
    input.setAttribute("role", "combobox");
    input.setAttribute("aria-autocomplete", "list");
    input.setAttribute("aria-expanded", "false");

    const close = () => { list.hidden = true; active = -1; input.setAttribute("aria-expanded", "false"); };
    const pick = (i) => {
      const it = items[i];
      if (!it) return;
      input.value = it.value;
      close();
      cfg.onPick(it, setField);
    };
    const paint = () => {
      list.innerHTML = "";
      items.forEach((it, i) => {
        const li = document.createElement("li");
        li.setAttribute("role", "option");
        if (i === active) li.className = "active";
        const b = document.createElement("strong");
        b.textContent = it.value;
        li.appendChild(b);
        if (it.detail) {
          const sm = document.createElement("small");
          sm.textContent = it.detail;
          li.appendChild(sm);
        }
        li.addEventListener("mousedown", (e) => { e.preventDefault(); pick(i); });
        list.appendChild(li);
      });
      list.hidden = !items.length;
      input.setAttribute("aria-expanded", String(!!items.length));
      const cur = list.querySelector(".active");
      if (cur) cur.scrollIntoView({ block: "nearest" });
    };

    input.addEventListener("input", () => {
      items = cfg.getSuggestions(input.value);
      active = -1;
      paint();
      cfg.onType(input.value.trim(), setField);
    });
    input.addEventListener("focus", () => {
      if (input.value.trim()) { items = cfg.getSuggestions(input.value); active = -1; paint(); }
    });
    input.addEventListener("blur", () => setTimeout(close, 120));
    input.addEventListener("keydown", (e) => {
      const open = !list.hidden && items.length;
      if (e.key === "ArrowDown" && open) { e.preventDefault(); active = (active + 1) % items.length; paint(); }
      else if (e.key === "ArrowUp" && open) { e.preventDefault(); active = (active - 1 + items.length) % items.length; paint(); }
      else if (e.key === "Enter" && open && active >= 0) { e.preventDefault(); pick(active); }
      else if (e.key === "Escape" && open) { e.preventDefault(); e.stopPropagation(); close(); }
    });
  }

  function openForm(cfg) {
    $("dlg-title").textContent = cfg.title;
    $("dlg-save").textContent = cfg.saveLabel || "Save";
    $("dlg-save").disabled = false;
    setMsg($("dlg-msg"), "");
    const box = $("dlg-fields");
    box.innerHTML = "";
    dlgInputs = [];
    const setField = (name, value) => {
      const t = dlgInputs.find((i) => i.name === name);
      if (t) t.el.value = value;
    };
    cfg.fields.forEach((f) => {
      const label = document.createElement("label");
      if (f.wide) label.className = "wide";
      label.appendChild(document.createTextNode(f.label));
      let input;
      if (f.options) {
        input = document.createElement("select");
        f.options.forEach((o) => {
          const op = document.createElement("option");
          op.value = o.value; op.textContent = o.label;
          input.appendChild(op);
        });
      } else {
        input = document.createElement("input");
        input.type = f.type || "text";
        if (f.autocomplete) input.autocomplete = f.autocomplete;
      }
      input.value = f.value || "";
      input.disabled = !!f.disabled;
      if (f.readonly) input.readOnly = true;
      if (f.placeholder) input.placeholder = f.placeholder;

      if (f.suggest && cfg.getSuggestions) {
        input.autocomplete = "off";
        const wrap = document.createElement("span");
        wrap.className = "ac-wrap";
        const list = document.createElement("ul");
        list.className = "ac-list";
        list.hidden = true;
        list.setAttribute("role", "listbox");
        wrap.appendChild(input);
        wrap.appendChild(list);
        label.appendChild(wrap);
        attachSuggest(input, list, cfg, setField);
      } else {
        label.appendChild(input);
      }
      if (f.hint) {
        const s = document.createElement("small");
        s.textContent = f.hint;
        label.appendChild(s);
      }
      box.appendChild(label);
      dlgInputs.push({ name: f.name, el: input });
    });
    dlgSubmit = cfg.onSubmit;
    $("dlg").showModal();
    const first = dlgInputs.find((i) => !i.el.disabled && !i.el.readOnly);
    if (first) first.el.focus();
  }

  $("dlg-cancel").addEventListener("click", () => $("dlg").close());

  $("dlg-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!dlgSubmit) return;
    const values = {};
    dlgInputs.forEach((i) => { values[i.name] = i.el.value.trim(); });
    $("dlg-save").disabled = true;
    setMsg($("dlg-msg"), "Updating database...");
    const out = await dlgSubmit(values);
    if (out.error === "auth") { logout("Your session ended. Sign in again."); return; }
    if (out.ok) { $("dlg").close(); return; }
    $("dlg-save").disabled = false;
    setMsg($("dlg-msg"), out.error, true);
  });

  /* ---------- Startup Initialization ---------- */
  window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    if (token) showApp(); else showLogin("");
  });
</script>

<script>
  // Hide media widget once login view vanishes
  (function () {
    var login = document.getElementById('login');
    var ad = document.getElementById('adBox');
    if (!login || !ad) return;

    function check() {
      var hidden = login.hidden ||
                   login.style.display === 'none' ||
                   getComputedStyle(login).display === 'none' ||
                   !document.body.contains(login);
      if (hidden) {
        ad.style.display = 'none';
        observer.disconnect();
      }
    }

    var observer = new MutationObserver(check);
    observer.observe(document.body, { attributes: true, childList: true, subtree: true });
    check();
  })();
</script>
</body>
